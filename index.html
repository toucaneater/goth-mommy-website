<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <title>Goth Mommy Website</title>
</head>
<style>

    <body>
        <header>     
            <h1>goth mommies &lt;3 </h1>
        </header>
        
<div class="center-box">
        <div class="left-box">
             <img id="left-img" src="mario.jpg" alt="">
        </div>

        <div class="middle-box">
              <img id="center-img" src="staring.jpg" alt="">
        </div>

        <div class="right-box">
             <img id="right-img" src="ovulating.jpg" alt="">
        </div>

            <button id="Button"> </button>
</div>

<audio id="mysound" src="website.mp3"></audio>

<script>
document.getElementById("Button").onclick = function() {

    // Remove only children inside center-box
    document.querySelectorAll(".center-box > div").forEach(child => {
        child.style.display = "none";
    });

    // Remove button itself
    this.style.display = "none";

    // Add new text
    const message = document.createElement("h2");
    message.innerText = "You're a good boy.";
    message.style.color = "white";
    message.style.textAlign = "center";
    message.style.marginTop = "40vh";

    document.querySelector(".center-box").appendChild(message);

    // Play audio
    document.getElementById("mysound").play();
};
</script>

    </body>
